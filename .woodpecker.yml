when:
  branch: main
  event: [push, manual, cron]

steps:
  # Check if this commit has already been built
  check-if-built:
    image: alpine:latest
    environment:
      COMMIT_SHA: ${CI_COMMIT_SHA:0:8}
    commands:
      - apk add --no-cache curl jq
      - |
        echo "Checking if commit $COMMIT_SHA already exists in Docker Hub..."
        IMAGE_EXISTS=$(curl -s "https://hub.docker.com/v2/repositories/scottftvw/video-recorder-monitor/tags/$COMMIT_SHA" | jq -r '.name // "not_found"')
        if [ "$IMAGE_EXISTS" != "not_found" ]; then
          echo "Image for commit $COMMIT_SHA already exists - skipping build"
          exit 78  # Exit code 78 tells Woodpecker to skip remaining steps
        else
          echo "Image not found - proceeding with build"
        fi
    when:
      event: cron  # Only check on cron runs, always build on push/manual

  # Test step - run linter and tests
  test:
    image: python:3.10-slim
    commands:
      - pip install --no-cache-dir -r requirements.txt
      - python -m py_compile app.py || echo "No linter configured"
      - echo "No tests configured yet"

  # Build Docker image
  build:
    image: plugins/docker
    settings:
      repo: scottftvw/video-recorder-monitor
      tags:
        - latest
        - ${CI_COMMIT_SHA:0:8}
      dockerfile: Dockerfile
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
    when:
      event: [push, manual, cron]

  # Deploy to Kubernetes via Portainer API
  deploy:
    image: curlimages/curl
    environment:
      PORTAINER_URL: https://10.1.81.51:30943
      PORTAINER_ENDPOINT_ID: 1
      K8S_NAMESPACE: tvw
      K8S_DEPLOYMENT: dvr-trigger
    secrets: [portainer_token]
    commands:
      - >-
        curl -sk -X PATCH
        -H "X-API-Key: $PORTAINER_TOKEN"
        -H "Content-Type: application/strategic-merge-patch+json"
        -d "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"ci.woodpecker/redeploy-timestamp\":\"$(date +%s)\"}}}}}"
        "$PORTAINER_URL/api/endpoints/$PORTAINER_ENDPOINT_ID/kubernetes/apis/apps/v1/namespaces/$K8S_NAMESPACE/deployments/$K8S_DEPLOYMENT"
      - sleep 10
      - >-
        curl -sk
        -H "X-API-Key: $PORTAINER_TOKEN"
        "$PORTAINER_URL/api/endpoints/$PORTAINER_ENDPOINT_ID/kubernetes/apis/apps/v1/namespaces/$K8S_NAMESPACE/deployments/$K8S_DEPLOYMENT"
        | grep -o '"availableReplicas":[0-9]*' || echo "Waiting for rollout..."
    when:
      event: [push, manual, cron]
      branch: main
